name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level to install (optional override)'
        required: false
      build-tools:
        description: 'Android build-tools version to install (optional override)'
        required: false

permissions:
  contents: read
  packages: write

env:
  ANDROID_API_LEVEL: 33
  ANDROID_BUILD_TOOLS: '33.0.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install frontend dependencies (apps/web)
        run: npm ci --prefix apps/web

      - name: Run frontend tests (optional)
        run: npm test --prefix apps/web
        # remove or set `if: false` if you don't have tests

      - name: Build web app (apps/web)
        run: npm run build --prefix apps/web

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: ${{ github.event.inputs.api-level || env.ANDROID_API_LEVEL }}
          build-tools: ${{ github.event.inputs.build-tools || env.ANDROID_BUILD_TOOLS }}

      - name: Verify Android SDK environment
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERROR: ANDROID_SDK_ROOT not set by setup-android action"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT is set to: $ANDROID_SDK_ROOT"
          ls -la "${ANDROID_SDK_ROOT}/" || echo "Warning: Could not list ANDROID_SDK_ROOT"

      - name: Ensure Android SDK components and licenses
        run: |
          set -euo pipefail
          API_LEVEL="${{ github.event.inputs.api-level || env.ANDROID_API_LEVEL }}"
          BUILD_TOOLS="${{ github.event.inputs.build-tools || env.ANDROID_BUILD_TOOLS }}"
          echo "Ensuring Android SDK components: platforms;android-${API_LEVEL}, build-tools;${BUILD_TOOLS}, platform-tools"

          # Find sdkmanager in common locations or rely on PATH
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
          else
            SDKMANAGER="sdkmanager"
          fi

          echo "Using sdkmanager at: $SDKMANAGER"

          # Install required components (non-interactive). Some runners already have these; this ensures they're present.
          yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}" || true

          # Accept all licenses (best-effort)
          yes | "$SDKMANAGER" --licenses || echo "License accept may have failed but continuing"

      - name: Grant execute permission for gradlew
        run: chmod +x ./apps/web/android/gradlew

      - name: Build APK with Gradle
        run: ./apps/web/android/gradlew -p ./apps/web/android assembleRelease --no-daemon
        # Fixed: Use full path and -p flag to specify project directory

      - name: Locate APK file
        id: apk
        run: |
          set -euo pipefail
          # Search for release APK in common output locations
          APK_PATH=$(find ./apps/web/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found"
            echo "Searching for any APK files..."
            find ./apps/web/android -name "*.apk" -type f 2>/dev/null || echo "No APK files found at all"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          APK_FILE="${{ steps.apk.outputs.apk_path }}"
          
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file not found at $APK_FILE"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z "$APK_FILE" 2>/dev/null || stat -c%s "$APK_FILE" 2>/dev/null)
          echo "APK file size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "WARNING: APK file seems unusually small (< 1MB)"
          fi

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (on push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
